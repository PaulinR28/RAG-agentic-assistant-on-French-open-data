[project]
name = "aides-rag"
version = "0.1.0"
description = "RAG + agentic assistant over French public business aids (green transition & innovation)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "snowballstemmer>=2.2",
    "openai>=3.31.0",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "ollama>=0.6.3",
    "sentence-transformers>=3.0",
    "psutil>=5.9",
]

[dependency-groups]
dev = ["pytest>=8.0"]
notebooks = ["matplotlib>=3.8", "ipykernel>=6.29", "nbconvert>=7.16"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aides_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
